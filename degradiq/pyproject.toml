[project]
name = "degradiq-api"
version = "0.1.0"
requires-python = ">=3.12"
# Runtime dependencies for the API and core model prediction.
# Kept in exact agreement with degradiq/requirements.txt (the API dependency set);
# Vercel installs these from pyproject.toml when it is present.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "joblib>=1.3",
]

[tool.vercel]
entrypoint = "api:app"
