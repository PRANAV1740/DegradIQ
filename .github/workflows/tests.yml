name: tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Dashboard requirements pull in the full runtime: core model deps plus
          # fastf1, matplotlib, plotly and streamlit, which the test suite imports.
          pip install -r degradiq/requirements-dashboard.txt
          pip install pytest

      - name: Run test suite
        # `python -m pytest` puts the repo root on sys.path so `import degradiq`
        # resolves (a repo-root conftest.py also guards this). The suite is otherwise
        # self-contained (synthetic fixtures + tracked artifacts); the one legacy
        # dashboard smoke test skips itself if the live FastF1 calendar is unreachable.
        run: python -m pytest degradiq/tests/ -q
